<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#10141a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g transform="translate(600, 260)">
    <text x="0" y="0" font-family="'Space Grotesk', 'Inter', sans-serif" font-weight="700" font-size="220" text-anchor="middle" dominant-baseline="central" letter-spacing="12">
      <tspan fill="#ffffff" filter="url(#glow)">S</tspan><tspan fill="#ff3344" filter="url(#glow)">N</tspan>
    </text>
    <text x="0" y="160" font-family="'JetBrains Mono', 'Space Mono', monospace" font-weight="400" font-size="22" text-anchor="middle" fill="#8b949e" letter-spacing="4">
      TACTICAL HUD
    </text>
  </g>
  <line x1="200" y1="430" x2="1000" y2="430" stroke="#21262d" stroke-width="2"/>
  <text x="600" y="490" font-family="'JetBrains Mono', 'Space Mono', monospace" font-weight="400" font-size="18" text-anchor="middle" fill="#8b949e" letter-spacing="2">
    OPERATOR-STYLE STUDY DASHBOARD
  </text>
</svg>
